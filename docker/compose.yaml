# Stack de voz en Docker. Un comando y funciona:
#
#     ./bajar-modelo.sh
#     echo "VOZ_TOKEN=$(openssl rand -hex 24)" > .env
#     docker compose up -d --build
#
# No hace falta Nix. Se construye para la arquitectura de esta máquina, así
# que en un Mac ARM salen imágenes ARM sin constructor remoto.
#
# El contexto de construcción es la RAÍZ del repo (`context: ..`), no esta
# carpeta: los Dockerfile necesitan los uv.lock y el código de `pkgs/`.

name: voz

services:
  # --------------------------------------------------------------------
  # Transcripción. Va primero porque voz-api depende de él.
  # --------------------------------------------------------------------
  whisper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.whisper
    image: voz-whisper:local
    restart: unless-stopped
    volumes:
      # El modelo no va dentro de la imagen: 466 MB que atarían su versión a
      # la del contenedor. Bájalo una vez con ./bajar-modelo.sh
      - ./modelos:/modelos:ro
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------
  # Piper (TTS) + fachada HTTP. El camino rápido: RTF 0,042.
  # --------------------------------------------------------------------
  voz-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voz-api
    image: voz-api:local
    restart: unless-stopped
    depends_on:
      whisper:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Sin token la API queda ABIERTA a quien alcance el puerto.
      VOZ_TOKEN: "${VOZ_TOKEN:-}"
      VOZ_WHISPER_URL: "http://whisper:8081"
      # Sesga el vocabulario de whisper. Es el ajuste que MÁS se nota: sin él
      # transcribe "WireGuard" como "We The War". Mete aquí tu jerga.
      VOZ_PROMPT_STT: >-
        Vocabulario tecnico: homelab, Proxmox, WireGuard, Docker, contenedor,
        Caddy, systemd, OpenClaw, Piper, whisper, backup, deploy, NixOS.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------
  # VibeVoice con streaming. NO arranca por defecto:
  #     docker compose --profile pesado up -d --build
  #
  # Construirla descarga ~2,5 GB de modelo y tarda un rato. Necesita ~6 GB de
  # RAM libres: pide 2,5 en régimen pero hace un pico de 4,6 al cargar.
  # --------------------------------------------------------------------
  voz-stream:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voz-stream
    image: voz-stream:local
    # NO "unless-stopped": si falta memoria, el contenedor muere SIEMPRE en el
    # mismo punto y reintentar es un bucle infinito. Se midio: 39 reinicios en
    # 10 minutos quemando CPU y disco, sin un solo mensaje de error. Con
    # on-failure:3 se rinde y deja el fallo a la vista.
    restart: on-failure:3
    profiles: ["pesado"]
    ports:
      - "8082:8082"
    environment:
      VOZ_TOKEN: "${VOZ_TOKEN:-}"
      # 6 pasos es el punto dulce medido: bajar a 4 gana un 3% y subir a 20
      # cuesta un 26%.
      VIBEVOICE_PASOS: "6"
      VIBEVOICE_VOZ: "sp-Spk1_man"
      # Si el contenedor muere DESPUES de cargar el modelo, mientras genera
      # el audio de calentamiento, es que no le llega la memoria: a los
      # ~2,5 GB del modelo se le suman las activaciones de una sintesis
      # entera. Pasa tipicamente en Docker Desktop sobre un Mac.
      #
      # Poner a 1 lo salta. El servicio funciona igual; solo paga ese coste
      # en la primera peticion real, que sera mas lenta.
      VIBEVOICE_SIN_CALENTAMIENTO: "${VIBEVOICE_SIN_CALENTAMIENTO:-0}"
    deploy:
      resources:
        limits:
          # 7g, y cada subida está medida. Con 5g moría cargando el modelo
          # (pico 4,9 GiB); con 6g cargaba pero moría GENERANDO, clavado en
          # 6,0/6,0 GiB. El pico transitorio de una síntesis está entre 6 y 7:
          # con 7g completa y luego se asienta en 3,6 GiB.
          #
          # Lo traicionero es cómo muere: código de salida 0 y OOMKilled a
          # false. Parece un cierre limpio y es el sistema matándolo.
          #
          # OJO EN MAC: este límite no crea memoria. Docker Desktop reparte lo
          # que tenga asignado en Ajustes → Resources. Para este perfil MÁS
          # whisper y voz-api hacen falta ~10 GB ahí; si no, arranca pero
          # muere en la primera petición.
          memory: 7g
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      # Carga el modelo y hace una síntesis de calentamiento: ~2 minutos hasta
      # aceptar la primera petición.
      start_period: 180s

  # --------------------------------------------------------------------
  # El mismo servicio, pero sobre una NVIDIA:
  #     docker compose --profile gpu up -d --build
  #
  # Es el MISMO Dockerfile: lo único que cambia es que sustituye torch por la
  # rueda de CUDA. El código detecta la tarjeta solo y pasa a fp16 sin
  # cuantizar, porque el int8 dinámico solo existe para CPU.
  #
  # En el anfitrión hacen falta el driver de NVIDIA y nvidia-container-toolkit.
  # Comprueba que Docker ve la tarjeta antes de nada:
  #
  #     docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu24.04 nvidia-smi
  #
  # NO sirve en un Mac: los contenedores corren en una VM Linux que no tiene
  # acceso a Metal, así que MPS es invisible desde Docker. Para el Mac, el
  # servicio va nativo -- ver scripts/voz-stream-mac.sh.
  # --------------------------------------------------------------------
  voz-stream-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voz-stream
      args:
        TORCH_CUDA: "${TORCH_CUDA:-cu130}"
    image: voz-stream:gpu
    # Mismo motivo que arriba: si no encuentra la GPU o falta VRAM, falla
    # siempre igual y reintentar solo esconde el error.
    restart: on-failure:3
    profiles: ["gpu"]
    ports:
      - "8082:8082"
    environment:
      VOZ_TOKEN: "${VOZ_TOKEN:-}"
      VIBEVOICE_PASOS: "6"
      VIBEVOICE_VOZ: "sp-Spk1_man"
      # "auto" ya elegiría cuda; se deja explícito para que un fallo de
      # detección se note al arrancar en vez de degradar a CPU en silencio.
      VIBEVOICE_DISPOSITIVO: "cuda"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      # Mucho menor que en CPU: en GPU no hay que cuantizar ni calentar tanto.
      start_period: 90s
