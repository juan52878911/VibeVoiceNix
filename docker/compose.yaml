# Stack de voz en Docker. Un comando y funciona:
#
#     ./bajar-modelo.sh
#     echo "VOZ_TOKEN=$(openssl rand -hex 24)" > .env
#     docker compose up -d --build
#
# No hace falta Nix. Se construye para la arquitectura de esta máquina, así
# que en un Mac ARM salen imágenes ARM sin constructor remoto.
#
# El contexto de construcción es la RAÍZ del repo (`context: ..`), no esta
# carpeta: los Dockerfile necesitan los uv.lock y el código de `pkgs/`.

name: voz

services:
  # --------------------------------------------------------------------
  # Transcripción. Va primero porque voz-api depende de él.
  # --------------------------------------------------------------------
  whisper:
    build:
      context: ..
      dockerfile: docker/Dockerfile.whisper
    image: voz-whisper:local
    restart: unless-stopped
    volumes:
      # El modelo no va dentro de la imagen: 466 MB que atarían su versión a
      # la del contenedor. Bájalo una vez con ./bajar-modelo.sh
      - ./modelos:/modelos:ro
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------
  # Piper (TTS) + fachada HTTP. El camino rápido: RTF 0,042.
  # --------------------------------------------------------------------
  voz-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voz-api
    image: voz-api:local
    restart: unless-stopped
    depends_on:
      whisper:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Sin token la API queda ABIERTA a quien alcance el puerto.
      VOZ_TOKEN: "${VOZ_TOKEN:-}"
      VOZ_WHISPER_URL: "http://whisper:8081"
      # Sesga el vocabulario de whisper. Es el ajuste que MÁS se nota: sin él
      # transcribe "WireGuard" como "We The War". Mete aquí tu jerga.
      VOZ_PROMPT_STT: >-
        Vocabulario tecnico: homelab, Proxmox, WireGuard, Docker, contenedor,
        Caddy, systemd, OpenClaw, Piper, whisper, backup, deploy, NixOS.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------
  # VibeVoice con streaming. NO arranca por defecto:
  #     docker compose --profile pesado up -d --build
  #
  # Construirla descarga ~2,5 GB de modelo y tarda un rato. Necesita ~6 GB de
  # RAM libres: pide 2,5 en régimen pero hace un pico de 4,6 al cargar.
  # --------------------------------------------------------------------
  voz-stream:
    build:
      context: ..
      dockerfile: docker/Dockerfile.voz-stream
    image: voz-stream:local
    restart: unless-stopped
    profiles: ["pesado"]
    ports:
      - "8082:8082"
    environment:
      VOZ_TOKEN: "${VOZ_TOKEN:-}"
      # 6 pasos es el punto dulce medido: bajar a 4 gana un 3% y subir a 20
      # cuesta un 26%.
      VIBEVOICE_PASOS: "6"
      VIBEVOICE_VOZ: "sp-Spk1_man"
    deploy:
      resources:
        limits:
          # Generoso a propósito: por debajo del pico de carga el contenedor
          # muere a mitad de arrancar y sin mensaje claro.
          memory: 5g
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8082' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      # Carga el modelo y hace una síntesis de calentamiento: ~2 minutos hasta
      # aceptar la primera petición.
      start_period: 180s
