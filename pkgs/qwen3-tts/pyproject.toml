[project]
name = "qwen3-tts-env"
version = "1.0.0"
description = "Entorno de Qwen3-TTS (0.6B / 1.7B) para el banco de comparacion, el lote y el afinado en CPU"
requires-python = ">=3.11,<3.13"
dependencies = [
    # El paquete oficial de Alibaba: trae Qwen3TTSModel, el tokenizador de voz
    # de 12 Hz y generate_voice_clone. Es el camino de REFERENCIA (PyTorch):
    # sirve para medir calidad, no para tiempo real en esta CPU.
    "qwen-tts",
    "torch",
    "torchaudio",
    # Las mismas metricas que scripts/banco_clonado.py, para que las cifras de
    # Qwen3 y de VibeVoice salgan del MISMO juez.
    "speechbrain",          # ECAPA (identidad de locutor)
    "faster-whisper",       # WER
    "soundfile",
    "numpy",
]

[project.optional-dependencies]
# Solo para entrenar (entrenar/afinar_qwen.py). Fuera del entorno por defecto
# para que el lote y el banco no arrastren accelerate/peft.
entrenar = [
    "peft>=0.14",
    "accelerate>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
# Mismo truco que pkgs/vibevoice/pyproject.toml: en darwin resuelve la rueda
# con MPS y en linux la de solo CPU. Sin CUDA a proposito: aqui no hay GPU.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
