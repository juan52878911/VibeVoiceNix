[project]
name = "vibevoice-env"
version = "1.0.0"
description = "Entorno de VibeVoice-Realtime-0.5B para inferencia en CPU"
requires-python = ">=3.11,<3.13"
dependencies = [
    "vibevoice",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Paquete contenedor: no aporta codigo propio, solo fija el conjunto de deps.
bypass-selection = true

[tool.uv.sources]
# VibeVoice no esta en PyPI. Se fija a un commit concreto: sin esto el lock
# no seria reproducible, que es justo lo que buscamos.
vibevoice = { git = "https://github.com/microsoft/VibeVoice.git", rev = "94da20d98b2fa7688e9cbfaf7692ddb4954f7600" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
# La rueda de CUDA pesa ~2,5 GB y esta maquina no tiene GPU NVIDIA. Ademas se
# midio que la iGPU Intel UHD 630 es 2,5x mas lenta que la CPU, asi que CPU a secas.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# uv2nix consume ruedas precompiladas; compilar torch en la sandbox de Nix
# no es viable en este hardware.
package = false
