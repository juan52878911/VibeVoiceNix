[project]
name = "vibevoice-env"
version = "1.0.0"
description = "Entorno de VibeVoice-Realtime-0.5B para inferencia en CPU"
requires-python = ">=3.11,<3.13"
dependencies = [
    "vibevoice",
    "torch",
    # transformers los pide si cae al tokenizador lento. El modelo lleva
    # tokenizer.json vendorizado y no deberia hacer falta, pero sin ellos el
    # fallo es un ImportError en mitad de la carga.
    "protobuf",
    "sentencepiece",
    # Motor alternativo de inferencia. Con el pipeline convertido a IR, el RTF
    # baja de 2,19 a 1,09 en el mismo hardware: el decodificador acustico pasa
    # de 165 a 66 ms por llamada porque el grafo compilado elimina el despacho
    # de Python sobre decenas de convoluciones pequenas.
    #
    # Version FIJADA a la validada: la conversion depende de APIs concretas
    # (apply_make_stateful_transformation, formas estaticas del estado) y la
    # paridad numerica se comprobo contra esta. Subir de version obliga a
    # repetir la verificacion, no solo a relanzar el lock.
    "openvino==2025.4.1",
    # Solo hace falta para CONVERTIR (compress_weights int8/int4); la
    # inferencia no lo usa. Se incluye para que la conversion sea reproducible
    # desde el mismo entorno.
    "nncf==3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Paquete contenedor: no aporta codigo propio, solo fija el conjunto de deps.
bypass-selection = true

[tool.uv.sources]
# VibeVoice no esta en PyPI. Se fija a un commit concreto: sin esto el lock
# no seria reproducible, que es justo lo que buscamos.
vibevoice = { git = "https://github.com/microsoft/VibeVoice.git", rev = "94da20d98b2fa7688e9cbfaf7692ddb4954f7600" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
# La rueda de CUDA pesa ~2,5 GB y esta maquina no tiene GPU NVIDIA. Ademas se
# midio que la iGPU Intel UHD 630 es 2,5x mas lenta que la CPU, asi que CPU a secas.
#
# PARA USAR UNA NVIDIA no basta con tener la tarjeta: esta rueda NO trae CUDA
# compilado, asi que torch.cuda.is_available() da False siempre y voz-stream
# se queda en CPU por mucha GPU que haya. Hay que cambiar la url de aqui abajo
# por la de CUDA y regenerar el lock:
#
#     url = "https://download.pytorch.org/whl/cu124"
#     uv lock --upgrade-package torch
#
# En Apple Silicon NO hace falta tocar nada: las ruedas de macOS ya traen MPS,
# asi que 'auto' lo detecta solo.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# uv2nix consume ruedas precompiladas; compilar torch en la sandbox de Nix
# no es viable en este hardware.
package = false
