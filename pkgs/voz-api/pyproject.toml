[project]
name = "voz-api"
version = "1.0.0"
description = "API de voz del homelab: TTS con Piper y STT con whisper.cpp"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "piper-tts>=1.3",
    "pydantic>=2.9",
]

[project.scripts]
voz-api = "voz_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voz_api"]

[tool.uv]
# Ruedas precompiladas: uv2nix las consume tal cual y evitamos compilar
# onnxruntime y compañía dentro de la sandbox de Nix.
package = true
